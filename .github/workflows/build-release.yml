name: Build & Release LeviMod

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build .levipack & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build powershell wget unzip

      - name: Setup Android NDK r28b
        run: |
          echo "Mengunduh Android NDK r28b..."
          wget -q https://dl.google.com/android/repository/android-ndk-r28b-linux.zip -O /tmp/ndk.zip
          echo "Mengekstrak NDK..."
          unzip -q /tmp/ndk.zip -d $HOME
          rm /tmp/ndk.zip
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r28b" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/android-ndk-r28b" >> $GITHUB_ENV

      - name: Build Mod Package
        run: |
          pwsh ./scripts/package.ps1 -Abi arm64-v8a

      - name: Locate Built .levipack File
        id: locate_file
        run: |
          FILE_PATH=$(find build-arm64-v8a -type f -name "*.levipack" | head -n 1)
          if [ -z "$FILE_PATH" ]; then
            echo "ERROR: File .levipack tidak ditemukan!"
            exit 1
          fi
          echo "Found package: $FILE_PATH"
          echo "LEVIPACK_PATH=$FILE_PATH" >> $GITHUB_ENV

      - name: Upload Build Artifact (Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: autoclickerlevimod-arm64-v8a
          path: ${{ env.LEVIPACK_PATH }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.LEVIPACK_PATH }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
